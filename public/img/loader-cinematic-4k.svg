 <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="matrix(-1350 240 180 900 3760 850)" gradientUnits="userSpaceOnUse"><stop stop-color="#0879ff" stop-opacity=".55"/><stop offset=".38" stop-color="#142d79" stop-opacity=".27"/><stop offset="1" stop-color="#02040a" stop-opacity="0"/></radialGradient>
