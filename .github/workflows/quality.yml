name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run validate
      - name: End-to-end critical flows
        env:
          CHROME_BIN: google-chrome
        run: npm run test:e2e
      - name: Block sensitive artifacts
        shell: bash
        run: |
          test ! -e .env.local
          test ! -d .vercel
          test ! -d .git/modules
          ! git grep -nE '(VERCEL_OIDC_TOKEN|GEMINI_API_KEY|RESEND_API_KEY|UPSTASH_REDIS_REST_TOKEN)=[^<[:space:]]+' -- ':!*.example' ':!tests/**'
