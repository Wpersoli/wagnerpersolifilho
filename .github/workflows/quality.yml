name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CHROME_BIN: google-chrome

jobs:
  validate:
    name: Validate, lint and security
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build, lint, contract tests and release checks
        env:
          NODE_OPTIONS: >-
            --unhandled-rejections=strict
            --throw-deprecation
        run: npm run validate

      - name: Block sensitive artifacts
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .env.local
          test ! -d .vercel
          test ! -d .git/modules

          ! find public -type f \
            \( \
              -name '*.bak' \
              -o -name '*.tmp' \
              -o -name '*.old' \
              -o -name '*.orig' \
              -o -name '*.webp.webp' \
              -o -name '*.webp.jpg' \
              -o -name '*.webp.png' \
            \) \
            -print -quit |
            grep -q .

          ! git grep -nE \
            '(VERCEL_OIDC_TOKEN|GEMINI_API_KEY|BREVO_API_KEY|RESEND_API_KEY|SUPABASE_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|UPSTASH_REDIS_REST_TOKEN)=[^<[:space:]]+' \
            -- \
            ':!*.example' \
            ':!tests/**'

  e2e:
    name: E2E 320–2560px
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run browser contracts, CLS and responsive matrix
        env:
          NODE_OPTIONS: >-
            --unhandled-rejections=strict
            --throw-deprecation
          E2E_DEBUG_PORT: "9237"
          CDP_COMMAND_TIMEOUT_MS: "90000"
        run: npm run test:e2e

  visual:
    name: Pixel-perfect visual audit
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run reference visual audit
        env:
          NODE_OPTIONS: >-
            --unhandled-rejections=strict
            --throw-deprecation
          VISUAL_AUDIT_DEBUG_PORT: "9347"
          CDP_COMMAND_TIMEOUT_MS: "90000"
        run: npm run test:visual

      - name: Upload visual audit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: artifacts/visual-audit
          if-no-files-found: ignore
          retention-days: 7